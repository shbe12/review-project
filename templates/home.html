{% extends "layout.html" %}
{% block content %}
    <div id="reviewsContainer">
        {% for review in reviews %}
            <article class="content-section py-3 px-4 mb-4">
                <div class="d-flex align-items-start gap-4">
                    <img class="rounded-circle article-img flex-shrink-0"
                         src="{{ url_for('static', path='icons/icon.png') }}"
                         alt="{{ review.name.username }}'s profile picture"
                         width="64"
                         height="64"
                         loading="lazy">
                    <div class="flex-grow-1">
                        <div class="article-metadata mb-2">
                            <a class="me-2"
                               href="#">{{ review.name}}</a>
                            <small class="text-body-secondary">{{ review.date_reviewed }}</small>
                        </div>
                        <h2>
                            <a class="article-title"
                               href="#">{{ review.activity }}</a>
                        </h2>
                        <p class="article-content">{{ review.comment }}</p>
                    </div>
                </div>
            </article>
        {% endfor %}
    </div>
    {% if has_more %}
        <div class="text-center mb-4">
            <button type="button" class="btn btn-outline-primary" id="loadMoreBtn">Load More reviews</button>
        </div>
    {% endif %}
{% endblock content %}
{% block scripts %}
    <script type="module">
  import { escapeHtml, formatDate } from '/static/js/utils.js';

  // Pagination state - initialized from server-rendered values
  let currentOffset = {{ limit }};  // Start after server-rendered reviews
  const limit = {{ limit }};
  let hasMore = {{ 'true' if has_more else 'false' }};

  const reviewsContainer = document.getElementById('reviewsContainer');
  const loadMoreBtn = document.getElementById('loadMoreBtn');

  // Create HTML for a single review (matching server-rendered structure)
  function createreviewHTML(review) {
    return `
      <article class="content-section py-3 px-4 mb-4">
        <div class="d-flex align-items-start gap-4">
          <img class="rounded-circle article-img flex-shrink-0" src="${escapeHtml(review.name.image_path)}" alt="${escapeHtml(review.name.username)}'s profile picture" width="64" height="64" loading="lazy">
          <div class="flex-grow-1">
            <div class="article-metadata mb-2">
              <a class="me-2" href="/users/${review.name.id}/reviews">${escapeHtml(review.name.username)}</a>
              <small class="text-body-secondary">${formatDate(review.date_reviewed)}</small>
            </div>
            <h2>
              <a class="article-title" href="/reviews/${review.id}">${escapeHtml(review.activity)}</a>
            </h2>
            <p class="article-content">${escapeHtml(review.comment)}</p>
          </div>
        </div>
      </article>
    `;
  }

  // Load more reviews from the API
  async function loadMorereviews() {
    // Disable button and show loading state
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = 'Loading...';

    let errorOccurred = false;

    try {
      const response = await fetch(`/api/reviews?skip=${currentOffset}&limit=${limit}`);

      if (!response.ok) {
        throw new Error('Failed to fetch reviews');
      }

      const data = await response.json();

      // Append new reviews to the container
      for (const review of data.reviews) {
        reviewsContainer.insertAdjacentHTML('beforeend', createreviewHTML(review));
      }

      // Update pagination state
      currentOffset += data.reviews.length;
      hasMore = data.has_more;

      // Hide button if no more reviews
      if (!hasMore) {
        loadMoreBtn.classList.add('d-none');
      }
    } catch (error) {
      errorOccurred = true;
      console.error('Error loading reviews:', error);
      // Show error message and keep button enabled for retry
      loadMoreBtn.textContent = 'Error - Click to Retry';
      loadMoreBtn.disabled = false;
    } finally {
      // Re-enable button and reset text only if no error occurred
      if (!errorOccurred && hasMore) {
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Load More reviews';
      }
    }
  }

  // Add click handler if button exists
  if (loadMoreBtn) {
    loadMoreBtn.addEventListener('click', loadMorereviews);
  }
    </script>
{% endblock scripts %}
